name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-save @deepseek-ai/schemastery@^3.18.1 @deepseek-ai/cordis@^4.0.1
      - run: node test/self-test.js
      - run: node test/accuracy-test.js
      - run: node test/reliability-test.js
      - run: node test/fuzz-test.js
      - run: node test/docx-test.js

  # 真机跨平台矩阵：Windows 的 CRLF/路径/venv 布局、macOS 的路径与换行都只有真机跑才算数
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @deepseek-ai/schemastery@^3.18.1 @deepseek-ai/cordis@^4.0.1
      - run: node test/self-test.js
      - run: node test/accuracy-test.js
      - run: node test/reliability-test.js
      - run: node test/fuzz-test.js
      - run: node test/docx-test.js

  # 宿主缝巡检：上游改事件名/服务名/客户端模块时在这里报警，而不是等用户发现
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/dsh-compat-check.mjs 0.1.1-rc.2 0.1.5-rc.2 0.1.6-alpha.2
