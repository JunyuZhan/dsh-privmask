name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # 客户端产物必须能从 client-src 重建（否则公开仓库里的源码是摆设）
      - run: npm run build:check
      - run: npm test

  # 真机跨平台矩阵：Windows 的 CRLF/路径/venv 布局、macOS 的路径与换行都只有真机跑才算数
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:check
      - run: npm test

  # 宿主缝巡检：上游改事件名/服务名/客户端模块时在这里报警，而不是等用户发现
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/dsh-compat-check.mjs 0.1.1-rc.2 0.1.5-rc.3 0.1.7-rc.2 0.2.1-rc.5 0.2.2-alpha.2
